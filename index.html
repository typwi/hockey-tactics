<title>Тактическая доска</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden; overscroll-behavior: none;
  }

  body {
    background: radial-gradient(1000px 600px at 50% -10%, #1b2a3a, #0a1016 70%);
    background-color: #0a1016;
    color: #dbe6f0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  .app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; gap: 4px;
    padding: calc(2px + env(safe-area-inset-top)) calc(2px + env(safe-area-inset-right))
             calc(4px + env(safe-area-inset-bottom)) calc(2px + env(safe-area-inset-left));
  }

  /* ---------- кнопки ---------- */
  button {
    position: relative;
    font: inherit; font-size: 17px; line-height: 1;
    color: #cfe0ee; background: #1b2733;
    border: 1px solid #2b3d4d; border-radius: 9px;
    height: 40px; padding: 0; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
    white-space: nowrap; overflow: hidden;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  button:active { transform: translateY(1px); }
  button.active {
    background: #2f7dd1; border-color: #57a5ee; color: #fff;
    box-shadow: 0 0 0 2px rgba(87,165,238,.25);
  }
  button.dis { opacity: .35; }
  @media (hover: hover) {
    button:hover { background: #24384a; border-color: #3d5b73; }
    button.active:hover { background: #2f7dd1; }
  }

  input[type=range] { accent-color: #4a9ae8; cursor: pointer; margin: 0; width: 100%; }

  /* ---------- нижняя панель ---------- */
  .toolbar {
    flex: none; order: 3;
    display: flex; gap: 4px;
    background: #101a24; border: 1px solid #22303d;
    border-radius: 12px; padding: 4px;
  }
  .toolbar > button, .toolbar > .menu-wrap { flex: 1 1 0%; min-width: 0; }
  .collapsed .toolbar { display: none; }

  .dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--c, #111111);
    box-shadow: 0 0 0 2px rgba(255,255,255,.65);
  }

  .rec { border-color: #7a2b25; background: #35191a; color: #ff9a90; font-size: 15px; }
  .rec.recording {
    background: #c2261a; border-color: #ff6b5e; color: #fff; font-size: 12px; font-weight: 700;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(226,57,70,.55); }
    50%     { box-shadow: 0 0 0 6px rgba(226,57,70,0); }
  }

  .badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px;
    background: #2f7dd1; color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .badge[hidden] { display: none; }

  /* ---------- всплывающие меню (открываются вверх) ---------- */
  .menu-wrap { position: relative; display: flex; }
  .menu-wrap > button { width: 100%; }

  .menu {
    position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 60;
    background: #16222e; border: 1px solid #2b3d4d; border-radius: 12px;
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
    width: max-content; max-width: calc(100vw - 12px);
    box-shadow: 0 -10px 30px rgba(0,0,0,.6);
  }
  .menu[hidden] { display: none; }

  .mi {
    width: 100%; min-width: 190px; height: 44px;
    padding: 0 14px; gap: 10px;
    justify-content: flex-start; font-size: 15px;
    overflow: visible;
  }
  .mi .ic { width: 22px; text-align: center; flex: none; }
  .mi.danger { color: #ffb3ad; }
  .menu hr { border: 0; border-top: 1px solid #2b3d4d; margin: 2px 0; width: 100%; }

  .chip {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    border: 2px solid rgba(255,255,255,.85);
  }
  .chip.home { background: radial-gradient(circle at 35% 30%, #ff7a6e, #c2261a 75%); }
  .chip.away { background: radial-gradient(circle at 35% 30%, #6fb3f5, #1a52a0 75%); }
  .chip.puck { width: 14px; height: 14px; margin: 0 3px; background: #111; border-color: #8b98a3; }

  .swatches { display: flex; gap: 10px; flex-wrap: nowrap; }
  .sw {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: var(--c) !important; border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .sw.active { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.2); }
  .width-row { display: flex; align-items: center; gap: 10px; padding: 4px 2px 2px; }
  .width-row span { font-size: 12px; color: #8ba3b8; }
  #widthPreview {
    flex: none; width: 34px; display: flex; align-items: center; justify-content: center;
  }
  #widthPreview i { display: block; width: 26px; border-radius: 10px; background: var(--c, #111); box-shadow: 0 0 0 1px rgba(255,255,255,.4); }

  /* неактивно во время повтора */
  .replay-mode .ed { opacity: .3; pointer-events: none; }

  /* ---------- поле ---------- */
  .stage {
    flex: 1 1 auto; min-height: 0; position: relative; order: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .board {
    position: relative; overflow: hidden; border-radius: 12px;
    touch-action: none; flex: none;
    box-shadow: 0 16px 40px -18px #000;
  }

  .rink, #draw, #tokens, #replayTokens {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .rink { z-index: 1; display: block; }
  #draw { z-index: 2; }
  #tokens, #replayTokens { z-index: 3; }

  #replayTokens { display: none; pointer-events: none; }
  .replay-mode #replayTokens { display: block; }
  .replay-mode #tokens { display: none; }

  /* плавающие кнопки, когда панель скрыта */
  .float {
    position: absolute; right: 6px; bottom: 6px; z-index: 30;
    display: none; gap: 6px;
  }
  .collapsed .float { display: flex; }
  .float button {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(16,26,36,.85); border-color: rgba(61,91,115,.9);
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
  }
  .float .danger { color: #ffb3ad; }

  /* индикатор записи поверх поля */
  .rec-pill {
    position: absolute; top: 8px; left: 8px; z-index: 30;
    height: 32px; padding: 0 12px; gap: 6px; border-radius: 16px;
    background: #c2261a; border-color: #ff6b5e; color: #fff;
    font-size: 13px; font-weight: 700;
    animation: pulse 1.2s infinite;
  }
  .rec-pill[hidden] { display: none; }
  .mi .cnt { margin-left: auto; padding-left: 12px; color: #7f97ab; font-size: 13px; }
  .mi.rec-on { color: #ff9a90; }

  /* ---------- фишки ---------- */
  .token {
    position: absolute;
    width: calc(44 * var(--u, 1px));
    height: calc(44 * var(--u, 1px));
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: calc(19 * var(--u, 1px));
    font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.55);
    cursor: grab;
    border: 2px solid rgba(255,255,255,.85);
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.25);
    will-change: left, top; touch-action: none;
  }
  .token.home { background: radial-gradient(circle at 35% 30%, #ff7a6e, #c2261a 75%); }
  .token.away { background: radial-gradient(circle at 35% 30%, #6fb3f5, #1a52a0 75%); }
  .token.puck {
    width: calc(22 * var(--u, 1px));
    height: calc(22 * var(--u, 1px));
    background: radial-gradient(circle at 35% 30%, #4a4a4a, #0b0b0b 75%);
    border: 2px solid #8b98a3; font-size: 0;
  }
  .token.dragging {
    cursor: grabbing;
    transform: translate(-50%, -50%) scale(1.12);
    box-shadow: 0 8px 18px rgba(0,0,0,.6); z-index: 10;
  }
  .token.selected { box-shadow: 0 0 0 3px #ffd166, 0 4px 10px rgba(0,0,0,.5); }

  /* ---------- воспроизведение ---------- */
  .playback-bar {
    flex: none; order: 2;
    background: #101a24; border: 1px solid #22303d;
    border-radius: 12px; padding: 6px 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .playback-bar[hidden] { display: none; }

  .pb-top { display: flex; align-items: center; gap: 6px; }
  #pbName {
    flex: 1; min-width: 0; font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pb-top button { width: 42px; height: 36px; flex: none; }

  .progress {
    height: 24px; display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  .progress-track { width: 100%; height: 8px; background: #1b2733; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2f7dd1, #57a5ee); }

  .pb-bottom { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9fb8cd; }
  .pb-bottom input { flex: 1; }
  #speedLabel { min-width: 40px; text-align: center; font-weight: 700; color: #dbe6f0; }
  #pbTime { font-variant-numeric: tabular-nums; color: #8ba3b8; white-space: nowrap; }

  /* ---------- шторка записей ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    max-height: 65vh; max-height: 65dvh;
    display: flex; flex-direction: column;
    background: #101a24; border-top: 1px solid #2b3d4d;
    border-radius: 16px 16px 0 0;
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease;
    box-shadow: 0 -12px 30px rgba(0,0,0,.5);
  }
  .sheet.open { transform: none; }
  .sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex: none; }
  .sheet-head h2 {
    flex: 1; margin: 0; font-size: 13px; font-weight: 600; color: #7f97ab;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .sheet-head button { width: 40px; flex: none; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }

  #libList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lib-item {
    display: flex; align-items: center; gap: 8px;
    background: #17222d; border: 1px solid #22303d;
    border-radius: 10px; padding: 7px 8px;
  }
  .lib-info { flex: 1; min-width: 0; }
  .lib-name {
    font-size: 14px; font-weight: 600; color: #dbe6f0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lib-meta { font-size: 11px; color: #7f97ab; margin-top: 2px; }
  .lib-actions { display: flex; gap: 6px; }
  .lib-actions button { width: 44px; height: 40px; }
  .lib-actions .play { background: #1d3a57; border-color: #2f6597; color: #fff; }
  .empty { font-size: 13px; color: #6f8698; margin: 6px 0 4px; text-align: center; }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===== Поле ===== -->
  <div class="stage" id="stage">
    <div class="board" id="board">
      <svg class="rink" id="rinkSvg" viewBox="0 0 1000 425" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="iceGrad" cx="50%" cy="38%" r="78%">
            <stop offset="0%"   stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e6eff7"/>
          </radialGradient>
        </defs>
        <rect x="-3000" y="-3000" width="7000" height="7000" fill="#070d12"/>
        <g id="rinkContent"></g>
      </svg>

      <div id="tokens"></div>
      <div id="replayTokens"></div>
      <canvas id="draw"></canvas>
    </div>

    <!-- когда панель скрыта -->
    <div class="float">
      <button data-act="clearAll" class="ed danger" title="Очистить всё">🗑</button>
      <button data-act="undo" class="ed" title="Шаг назад">↶</button>
      <button id="showBtn" title="Показать панель">☰</button>
    </div>

    <button class="rec-pill" id="recPill" hidden title="Остановить запись">● <span id="recTime">0с</span> · стоп</button>
  </div>

  <!-- ===== Плеер ===== -->
  <div class="playback-bar" id="playbackBar" hidden>
    <div class="pb-top">
      <span id="pbName">—</span>
      <button id="restartBtn" title="С начала">⟲</button>
      <button id="pauseBtn" title="Пауза / играть">⏸</button>
      <button id="stopBtn" title="Выйти из повтора">⏹</button>
    </div>
    <div class="progress" id="progressWrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="pb-bottom">
      <span>Скорость</span>
      <input type="range" id="speedRange" min="0" max="5" step="1" value="2">
      <span id="speedLabel">1x</span>
      <span id="pbTime">0.0 / 0.0 с</span>
    </div>
  </div>

  <!-- ===== Панель (внизу, под большим пальцем) ===== -->
  <div class="toolbar" id="toolbar">
    <button data-tool="select" class="active" title="Двигать фишки">✋</button>
    <button data-tool="pen" class="ed" title="Карандаш">✏️</button>
    <div class="menu-wrap ed">
      <button id="colorBtn" data-menu="colorMenu" title="Цвет и толщина"><span class="dot"></span></button>
      <div class="menu" id="colorMenu" hidden>
        <div class="swatches">
          <button class="sw active" data-color="#111111" style="--c:#111111" title="Чёрный"></button>
          <button class="sw" data-color="#e63946" style="--c:#e63946" title="Красный"></button>
          <button class="sw" data-color="#2f7dd1" style="--c:#2f7dd1" title="Синий"></button>
          <button class="sw" data-color="#2fb56b" style="--c:#2fb56b" title="Зелёный"></button>
          <button class="sw" data-color="#f2a33c" style="--c:#f2a33c" title="Оранжевый"></button>
          <button class="sw" data-color="#a56bf0" style="--c:#a56bf0" title="Фиолетовый"></button>
        </div>
        <div class="width-row">
          <span>Толщина</span>
          <input type="range" id="widthRange" min="2" max="14" value="5">
          <div id="widthPreview"><i></i></div>
        </div>
      </div>
    </div>

    <button data-act="undo" class="ed dis" title="Шаг назад">↶</button>
    <button data-act="redo" class="ed dis" title="Шаг вперёд">↷</button>

    <div class="menu-wrap ed">
      <button id="addBtn" data-menu="addMenu" title="Добавить фишку">＋</button>
      <div class="menu" id="addMenu" hidden>
        <button class="mi" data-add="home"><span class="chip home"></span>Игрок A</button>
        <button class="mi" data-add="away"><span class="chip away"></span>Игрок B</button>
        <button class="mi" data-add="puck"><span class="chip puck"></span>Шайба</button>
      </div>
    </div>

    <div class="menu-wrap">
      <button id="moreBtn" data-menu="moreMenu" title="Ещё">⋯</button>
      <div class="menu" id="moreMenu" hidden>
        <button class="mi ed" data-tool="eraser"><span class="ic">⌫</span>Ластик</button>
        <button class="mi ed" data-act="rec"><span class="ic">●</span><span id="recLabel">Начать запись</span></button>
        <button class="mi" id="libBtn"><span class="ic">📼</span>Записи<span class="cnt" id="libBadge"></span></button>
        <hr>
        <button class="mi" id="viewBtn"><span class="ic">▭</span><span id="viewLabel">Поле: полное</span></button>
        <button class="mi" id="flipBtn"><span class="ic">🔄</span>Перевернуть</button>
        <button class="mi" id="logoBtn"><span class="ic">🖼</span><span id="logoLabel">Эмблема: 1</span></button>
        <hr>
        <button class="mi danger ed" id="clearBtn"><span class="ic">✕</span>Стереть все линии</button>
        <button class="mi danger ed" id="clearTokens"><span class="ic">✕</span>Убрать все фишки</button>
        <button class="mi danger ed" data-act="clearAll"><span class="ic">🗑</span>Очистить всё</button>
        <hr>
        <button class="mi" id="hideBtn"><span class="ic">⌄</span>Скрыть панель</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Шторка записей ===== -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h2>Записи</h2>
    <button id="sheetClose" title="Закрыть">✕</button>
  </div>
  <div class="sheet-body">
    <ul id="libList"></ul>
    <p class="empty" id="libEmpty">Пока нет записей. Нажмите ● чтобы записать.</p>
  </div>
</div>

  const widthRange  = $('widthRange');
  const widthPrev   = $('widthPreview').firstElementChild;
  const viewLabel   = $('viewLabel');
  const colorBtn    = $('colorBtn');
  const libBadge    = $('libBadge');
  const menus       = $$('.menu');

  const playbackBar = $('playbackBar');
  const pbName      = $('pbName');
  const pauseBtn    = $('pauseBtn');
  const speedRange  = $('speedRange');
  const speedLabel  = $('speedLabel');
  const progressWrap = $('progressWrap');
  const progressFill = $('progressFill');
  const pbTime      = $('pbTime');

  const sheet       = $('sheet');
  const backdrop    = $('backdrop');
  const libList     = $('libList');
  const libEmpty    = $('libEmpty');

  const recBtns  = $$('[data-act="rec"]');
  const undoBtns = $$('[data-act="undo"]');
  const redoBtns = $$('[data-act="redo"]');
  const toolBtns = $$('[data-tool]');

  let tool = 'select';
  let color = '#111111';
  let strokeWidth = 5;

  let strokes = [];            // {id,type,color,width,points:[{x,y}]}
  const tokens = new Map();    // id -> {d:{id,kind,x,y,label}, el}
  let current = null;          // рисуемая линия
  let erasing = null;          // {items:[{s,i}]}
  let selected = null;
  let drag = null;

  let history = [], future = [];
  let seq = 0;
  const uid = p => p + (++seq).toString(36) + Date.now().toString(36);

  let viewHalf = false, flipped = false, collapsed = false, logoIdx = 0;

  // VS.L — длина нарисованного катка, VS.M — матрица «каток → экран»
  let VS = { portrait: false, vw: W, vh: H, L: 0, M: [1, 0, 0, 1, 0, 0] };
  let G = null;                // разметка: опорные точки x → x'

  let rec = null;
  let lib = [];

  let player = { rec: null, time: 0, playing: false };
  let replayMode = false;
  const replayEls = new Map();
  let speed = 1;

  /* ================= настройки интерфейса ================= */

  function saveUI() {
    try { localStorage.setItem(UI_KEY, JSON.stringify({ viewHalf, flipped, collapsed, color, strokeWidth, logoIdx })); } catch (e) {}
  }
  function loadUI() {
    try {
      const s = JSON.parse(localStorage.getItem(UI_KEY) || 'null');
      if (s) {
        viewHalf = !!s.viewHalf; flipped = !!s.flipped; collapsed = !!s.collapsed;
        if (s.color) color = s.color;
        if (s.strokeWidth) strokeWidth = s.strokeWidth;
        if (s.logoIdx === 0 || s.logoIdx === 1) logoIdx = s.logoIdx;
      }
    } catch (e) {}
  }

  function setCollapsed(v) {
    collapsed = v;
    app.classList.toggle('collapsed', v);
    closeMenus();
    saveUI();
  }
  $('hideBtn').addEventListener('click', () => setCollapsed(true));
  $('showBtn').addEventListener('click', () => setCollapsed(false));

  /* ================= «гибкая» длина катка =================
     Координаты всего (линии, фишки, записи) хранятся в каноническом катке 1000×425.
     Чтобы полное поле занимало всю ширину телефона, нарисованный каток можно укоротить
     до L_MIN: сжимаются промежутки между линиями, а круги остаются кругами.          */

  const KX   = [0, 64, 162, 373, 500, 627, 838, 936, 1000];
  const KMIN = [40, 80, 110, 90, 90, 110, 80, 40];

  function makeGeo(L) {
    const slackTotal = W - KMIN.reduce((a, b) => a + b, 0);
    const R = W - L;
    const dst = [0];
    for (let i = 0; i < KMIN.length; i++) {
      const len = KX[i + 1] - KX[i];
      const slack = len - KMIN[i];
      dst.push(dst[i] + len - slack * R / slackTotal);
    }
    return { src: KX, dst };
  }

  function pw(x, a, b) {
    const n = a.length;
    let i = 0;
    while (i < n - 2 && x > a[i + 1]) i++;
    return b[i] + (x - a[i]) * (b[i + 1] - b[i]) / (a[i + 1] - a[i]);
  }
  const F    = x => pw(x, G.src, G.dst);   // каток → нарисованный
  const Finv = x => pw(x, G.dst, G.src);   // нарисованный → каток

  function buildRink() {
    const L = VS.L;
    const f = F;
    const r = 100;
    const gl = f(64), gr = f(936), c = f(500);
    const lg = LOGOS[logoIdx];
    const lh = lg.h, lw = lh * lg.ar;   // логотип целиком внутри центрального круга (r = 72)

    rinkContent.innerHTML = `
      <clipPath id="iceClip"><rect x="10" y="10" width="${L - 20}" height="405" rx="${r}" ry="${r}"/></clipPath>
      <rect x="10" y="10" width="${L - 20}" height="405" rx="${r}" ry="${r}" fill="url(#iceGrad)"/>
      <g clip-path="url(#iceClip)">
        <g id="logoG">
          <image href="${lg.src}" x="${c - lw / 2}" y="${212.5 - lh / 2}" width="${lw}" height="${lh}"
                 preserveAspectRatio="xMidYMid meet" opacity=".42"/>
        </g>
        <rect x="${f(378) - 5}" y="0" width="10" height="425" fill="#2f74c0" opacity=".9"/>
        <rect x="${f(622) - 5}" y="0" width="10" height="425" fill="#2f74c0" opacity=".9"/>
        <rect x="${c - 5}" y="0" width="10" height="425" fill="#d33a3a" opacity=".92"/>
        <rect x="${gl - 2}" y="0" width="4" height="425" fill="#d33a3a"/>
        <rect x="${gr - 2}" y="0" width="4" height="425" fill="#d33a3a"/>

        <g fill="none" stroke="#d33a3a" stroke-width="3">
          <circle cx="${c}" cy="212.5" r="72"/>
          <circle cx="${f(162)}" cy="108" r="72"/>
          <circle cx="${f(162)}" cy="317" r="72"/>
          <circle cx="${f(838)}" cy="108" r="72"/>
          <circle cx="${f(838)}" cy="317" r="72"/>
        </g>
        <g fill="#d33a3a">
          <circle cx="${c}" cy="212.5" r="6"/>
          <circle cx="${f(162)}" cy="108" r="6"/>
          <circle cx="${f(162)}" cy="317" r="6"/>
          <circle cx="${f(838)}" cy="108" r="6"/>
          <circle cx="${f(838)}" cy="317" r="6"/>
          <circle cx="${f(402)}" cy="108" r="6"/>
          <circle cx="${f(402)}" cy="317" r="6"/>
          <circle cx="${f(598)}" cy="108" r="6"/>
          <circle cx="${f(598)}" cy="317" r="6"/>
        </g>

        <path d="M${gl} 174.5 A 38 38 0 0 1 ${gl} 250.5 Z" fill="#b8d8ee" stroke="#d33a3a" stroke-width="2"/>
        <path d="M${gr} 174.5 A 38 38 0 0 0 ${gr} 250.5 Z" fill="#b8d8ee" stroke="#d33a3a" stroke-width="2"/>
        <rect x="${gl - 20}" y="198" width="20" height="29" rx="5" fill="#ffffff" stroke="#d33a3a" stroke-width="2"/>
        <rect x="${gr}" y="198" width="20" height="29" rx="5" fill="#ffffff" stroke="#d33a3a" stroke-width="2"/>
      </g>
      <rect x="10" y="10" width="${L - 20}" height="405" rx="${r}" ry="${r}"
            fill="none" stroke="#8ea6ba" stroke-width="8"/>`;
  }

  /* ================= эмблема и иконка ================= */

  const favIcon = $('favIcon'), touchIcon = $('touchIcon');
  const ICON1 = touchIcon.getAttribute('href');

  function applyLogo() {
    const icon = LOGOS[logoIdx].icon || ICON1;
    favIcon.setAttribute('href', icon);
    touchIcon.setAttribute('href', icon);
    $('logoLabel').textContent = 'Эмблема: ' + (logoIdx + 1);
    VS.L = 0;            // пересобрать каток с новой картинкой
  }

  $('logoBtn').addEventListener('click', () => {
    closeMenus();
    logoIdx = (logoIdx + 1) % LOGOS.length;
    saveUI();
    applyLogo();
    layout();
  });

  /* ================= раскладка ================= */

  function layout() {
    const aw = Math.max(100, stage.clientWidth);
    const ah = Math.max(100, stage.clientHeight);
    VS.portrait = ah > aw;

    let L = W;
    if (!viewHalf) {
      const want = VS.portrait ? ah / aw * H : aw / ah * H;
      L = Math.round(Math.max(L_MIN, Math.min(W, want)));
    }
    if (L !== VS.L) {
      VS.L = L;
      G = makeGeo(L);
      buildRink();
    }

    const len = viewHalf ? HALF : L;
    if (VS.portrait) { VS.vw = H; VS.vh = len; }
    else             { VS.vw = len; VS.vh = H; }

    if (!VS.portrait) VS.M = flipped ? [-1, 0, 0, -1, L, H] : [1, 0, 0, 1, 0, 0];
    else              VS.M = flipped ? [0, -1, 1, 0, 0, L]  : [0, 1, -1, 0, H, 0];

    rinkSvg.setAttribute('viewBox', `0 0 ${VS.vw} ${VS.vh}`);
    rinkContent.setAttribute('transform', 'matrix(' + VS.M.join(' ') + ')');

    // логотип всегда стоит ровно, как бы ни был повёрнут каток
    const ang = Math.atan2(VS.M[1], VS.M[0]) * 180 / Math.PI;
    const lg = $('logoG');
    if (lg) lg.setAttribute('transform', `rotate(${-ang} ${F(500)} 212.5)`);

    const sc = Math.min(aw / VS.vw, ah / VS.vh);
    const w = Math.floor(VS.vw * sc);
    const h = Math.floor(VS.vh * sc);
    board.style.width  = w + 'px';
    board.style.height = h + 'px';

    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    const s = canvas.width / VS.vw;
    const M = VS.M;
    ctx.setTransform(M[0] * s, M[1] * s, M[2] * s, M[3] * s, M[4] * s, M[5] * s);

    board.style.setProperty('--u', (w / VS.vw) + 'px');
    viewLabel.textContent = viewHalf ? 'Поле: половина' : 'Поле: полное';

    repositionAllTokens();
    if (replayMode) renderReplayFrame();
    else redraw();
  }

  // каток (x,y) → экранные единицы viewBox
  function toView(x, y) {
    const M = VS.M, xr = F(x);
    return { u: M[0] * xr + M[2] * y + M[4], v: M[1] * xr + M[3] * y + M[5] };
  }
  function fromView(u, v) {
    const [a, b, c, d, e, f] = VS.M;
    const det = a * d - b * c;
    const du = u - e, dv = v - f;
    const xr = (d * du - c * dv) / det;
    const y  = (-b * du + a * dv) / det;
    return { x: Finv(xr), y };
  }

  function positionToken(el, x, y) {
    const p = toView(x, y);
    el.style.left = (p.u / VS.vw * 100) + '%';
    el.style.top  = (p.v / VS.vh * 100) + '%';
  }

  function repositionAllTokens() {
    for (const t of tokens.values()) positionToken(t.el, t.d.x, t.d.y);
    replayEl.querySelectorAll('.token').forEach(el =>
      positionToken(el, parseFloat(el.dataset.x), parseFloat(el.dataset.y)));
  }

  function getPos(e) {
    const r = board.getBoundingClientRect();
    return fromView((e.clientX - r.left) / r.width * VS.vw,
                    (e.clientY - r.top)  / r.height * VS.vh);
  }

  /* ================= рисование ================= */

  function clearCanvas() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  function redraw() {
    if (replayMode) return;
    clearCanvas();
    for (const s of strokes) drawStroke(s);
    if (current) drawStroke(current);
  }

  function drawStroke(s) {
    if (!s.points || !s.points.length) return;
    const pts = s.points.map(p => ({ x: F(p.x), y: p.y }));

    ctx.strokeStyle = s.color;
    ctx.fillStyle   = s.color;
    ctx.lineWidth   = s.width;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';

    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, s.width / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
  }

  function segDist(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const len2 = vx * vx + vy * vy;
    let t = len2 ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (a.x + t * vx), p.y - (a.y + t * vy));
  }

  function strokeHit(s, p, R) {
    const pts = s.points.map(q => ({ x: F(q.x), y: q.y }));
    const mp = { x: F(p.x), y: p.y };
    if (pts.length === 1) return Math.hypot(pts[0].x - mp.x, pts[0].y - mp.y) < R + s.width;
    for (let i = 1; i < pts.length; i++) {
      if (segDist(mp, pts[i - 1], pts[i]) < R + s.width / 2) return true;
    }
    return false;
  }

  /* ================= запись ================= */

  function recNow() { return rec ? (performance.now() - rec.startedAt) / 1000 : 0; }

  function pushEvent(ev) {
    if (!rec || replayMode) return;
    ev.t = recNow();
    rec.events.push(ev);
  }

  function strokeEvents(s, t) {
    const out = [{ type: 'strokeStart', id: s.id, strokeType: s.type, color: s.color, width: s.width,
                   x: s.points[0].x, y: s.points[0].y, t }];
    for (let i = 1; i < s.points.length; i++) out.push({ type: 'strokePoint', id: s.id, x: s.points[i].x, y: s.points[i].y, t });
    out.push({ type: 'strokeEnd', id: s.id, t });
    return out;
  }

  function startRecording() {
    if (rec || replayMode) return;
    rec = {
      id: uid('r'),
      name: 'Запись ' + (lib.length + 1),
      created: Date.now(),
      events: [],
      startedAt: performance.now(),
      duration: 0
    };
    for (const s of strokes) rec.events.push(...strokeEvents(s, -1));
    for (const t of tokens.values()) rec.events.push({ type: 'tokenAdd', ...t.d, t: -1 });
    updateRecUI();
  }

  function stopRecording() {
    if (!rec) return;
    rec.duration = Math.max(0.2, (performance.now() - rec.startedAt) / 1000);
    const last = rec.events.length ? rec.events[rec.events.length - 1].t : 0;
    rec.duration = Math.max(rec.duration, last + 0.1);
    delete rec.startedAt;
    lib.unshift(rec);
    rec = null;
    saveLib();
    renderLib();
    updateRecUI();
  }

  let lastRecLabel = null;
  function updateRecUI() {
    recBtns.forEach(b => b.classList.toggle('rec-on', !!rec));
    $('recPill').hidden = !rec;
    lastRecLabel = null;
    updateRecLabel();
  }
  function updateRecLabel() {
    const secs = Math.floor(recNow()) + 'с';
    const label = rec ? 'Остановить запись · ' + secs : 'Начать запись';
    if (label === lastRecLabel) return;
    lastRecLabel = label;
    $('recLabel').textContent = label;
    $('recTime').textContent = secs;
  }
  $('recPill').addEventListener('click', () => stopRecording());

  recBtns.forEach(b => b.addEventListener('click', () => {
    if (replayMode) return;
    if (rec) stopRecording(); else startRecording();
  }));

  function stateAt(events, T) {
    const sm = new Map(), tm = new Map();
    for (const ev of events) {
      if (ev.t > T) break;
      switch (ev.type) {
        case 'strokeStart':
          sm.set(ev.id, { id: ev.id, type: ev.strokeType, color: ev.color, width: ev.width, points: [{ x: ev.x, y: ev.y }] });
          break;
        case 'strokePoint': { const s = sm.get(ev.id); if (s) s.points.push({ x: ev.x, y: ev.y }); break; }
        case 'strokeRemove': sm.delete(ev.id); break;
        case 'clearStrokes': sm.clear(); break;
        case 'tokenAdd': tm.set(ev.id, { id: ev.id, kind: ev.kind, x: ev.x, y: ev.y, label: ev.label }); break;
        case 'tokenMove': { const t = tm.get(ev.id); if (t) { t.x = ev.x; t.y = ev.y; } break; }
        case 'tokenRemove': tm.delete(ev.id); break;
        case 'clearTokens': tm.clear(); break;
      }
    }
    return { strokes: [...sm.values()], tokens: [...tm.values()] };
  }

  /* ================= базовые операции (пишут в запись) ================= */

  function strokeAddP(s, idx) {
    if (idx == null || idx > strokes.length) strokes.push(s);
    else strokes.splice(idx, 0, s);
    if (rec && !replayMode) rec.events.push(...strokeEvents(s, recNow()));
  }
  function strokeDelP(id) {
    const i = strokes.findIndex(s => s.id === id);
    if (i < 0) return -1;
    strokes.splice(i, 1);
    pushEvent({ type: 'strokeRemove', id });
    return i;
  }

  function createTokenEl(id, kind, label) {
    const el = document.createElement('div');
    el.className = 'token ' + kind;
    el.dataset.id = id;
    el.dataset.kind = kind;
    if (label) el.textContent = label;
    return el;
  }

  function tokenAddP(d) {
    const el = createTokenEl(d.id, d.kind, d.label);
    el.addEventListener('pointerdown', onTokenDown);
    el.addEventListener('contextmenu', e => { e.preventDefault(); if (!replayMode) doRemoveToken(d.id); });
    tokensEl.appendChild(el);
    tokens.set(d.id, { d: { ...d }, el });
    positionToken(el, d.x, d.y);
    pushEvent({ type: 'tokenAdd', id: d.id, kind: d.kind, x: d.x, y: d.y, label: d.label });
  }
  function tokenDelP(id) {
    const t = tokens.get(id);
    if (!t) return;
    t.el.remove();
    tokens.delete(id);
    if (selected === t.el) selected = null;
    pushEvent({ type: 'tokenRemove', id });
  }
  function tokenMoveP(id, x, y) {
    const t = tokens.get(id);
    if (!t) return;
    t.d.x = x; t.d.y = y;
    positionToken(t.el, x, y);
    pushEvent({ type: 'tokenMove', id, x, y });
  }

  /* ================= история (↶ ↷ для линий и фишек) ================= */

  function commit(a) {
    history.push(a);
    if (history.length > 300) history.shift();
    future = [];
    updateHistoryUI();
  }

  function applyAction(a) {
    switch (a.t) {
      case 'addStroke':   strokeAddP(a.s); break;
      case 'erase':       for (const it of a.items) strokeDelP(it.s.id); break;
      case 'clearStrokes': strokes = []; pushEvent({ type: 'clearStrokes' }); break;
      case 'addToken':    tokenAddP(a.d); break;
      case 'removeToken': tokenDelP(a.d.id); break;
      case 'moveToken':   tokenMoveP(a.id, a.to.x, a.to.y); break;
      case 'clearTokens': for (const d of a.items) tokenDelP(d.id); break;
      case 'clearAll':
        strokes = []; pushEvent({ type: 'clearStrokes' });
        for (const d of a.tokens) tokenDelP(d.id);
        break;
    }
  }

  function revertAction(a) {
    switch (a.t) {
      case 'addStroke':   strokeDelP(a.s.id); break;
      case 'erase':       for (let i = a.items.length - 1; i >= 0; i--) strokeAddP(a.items[i].s, a.items[i].i); break;
      case 'clearStrokes': for (const s of a.items) strokeAddP(s); break;
      case 'addToken':    tokenDelP(a.d.id); break;
      case 'removeToken': tokenAddP(a.d); break;
      case 'moveToken':   tokenMoveP(a.id, a.from.x, a.from.y); break;
      case 'clearTokens': for (const d of a.items) tokenAddP(d); break;
      case 'clearAll':
        for (const s of a.strokes) strokeAddP(s);
        for (const d of a.tokens) tokenAddP(d);
        break;
    }
  }

  function undo() {
    if (replayMode || !history.length) return;
    const a = history.pop();
    revertAction(a);
    future.push(a);
    clearSelection();
    redraw();
    updateHistoryUI();
  }
  function redo() {
    if (replayMode || !future.length) return;
    const a = future.pop();
    applyAction(a);
    history.push(a);
    clearSelection();
    redraw();
    updateHistoryUI();
  }
  function updateHistoryUI() {
    undoBtns.forEach(b => b.classList.toggle('dis', !history.length));
    redoBtns.forEach(b => b.classList.toggle('dis', !future.length));
  }

  undoBtns.forEach(b => b.addEventListener('click', undo));
  redoBtns.forEach(b => b.addEventListener('click', redo));

  /* ================= ввод на холсте ================= */

  canvas.addEventListener('pointerdown', e => {
    if (replayMode || tool === 'select') return;
    e.preventDefault();
    closeMenus();
    canvas.setPointerCapture(e.pointerId);
    const p = getPos(e);

    if (tool === 'eraser') { erasing = { items: [] }; eraseAt(p); return; }

    const id = uid('sk');
    current = { id, type: 'pen', color, width: strokeWidth, points: [p] };
    pushEvent({ type: 'strokeStart', id, strokeType: 'pen', color, width: strokeWidth, x: p.x, y: p.y });
    redraw();
  });

  canvas.addEventListener('pointermove', e => {
    if (replayMode) return;
    if (erasing) { eraseAt(getPos(e)); return; }
    if (!current) return;
    const p = getPos(e);
    const last = current.points[current.points.length - 1];
    if (Math.hypot(F(p.x) - F(last.x), p.y - last.y) > 1.5) {
      current.points.push(p);
      pushEvent({ type: 'strokePoint', id: current.id, x: p.x, y: p.y });
    }
    redraw();
  });

  function eraseAt(p) {
    let hit = false;
    for (const s of strokes.slice()) {
      if (strokeHit(s, p, 14)) {
        const i = strokeDelP(s.id);
        erasing.items.push({ s, i });
        hit = true;
      }
    }
    if (hit) redraw();
  }

  function endStroke() {
    if (erasing) {
      if (erasing.items.length) commit({ t: 'erase', items: erasing.items });
      erasing = null;
      return;
    }
    if (!current) return;

    const pts = current.points;
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);

    if (len > 3) {
      strokes.push(current);
      pushEvent({ type: 'strokeEnd', id: current.id });
      commit({ t: 'addStroke', s: current });
    } else {
      pushEvent({ type: 'strokeRemove', id: current.id });
    }
    current = null;
    redraw();
  }

  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* ================= инструменты и меню ================= */

  function updatePointerEvents() {
    const drawing = !replayMode && tool !== 'select';
    canvas.style.pointerEvents   = drawing ? 'auto' : 'none';
    tokensEl.style.pointerEvents = (!replayMode && tool === 'select') ? 'auto' : 'none';
  }

  function clearSelection() {
    if (selected) selected.classList.remove('selected');
    selected = null;
  }

  function setTool(t) {
    tool = t;
    toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === t));
    $('moreBtn').classList.toggle('active', t === 'eraser');
    board.style.cursor = t === 'select' ? 'default' : t === 'eraser' ? 'cell' : 'crosshair';
    if (t !== 'select') clearSelection();
    updatePointerEvents();
  }
  toolBtns.forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  function closeMenus() { menus.forEach(m => { m.hidden = true; }); }
  menus.forEach(m => m.addEventListener('click', e => { if (e.target.closest('.mi')) closeMenus(); }));

  // держим меню целиком на экране
  function placeMenu(m) {
    m.style.left = '0px';
    const r = m.getBoundingClientRect();
    const pad = 6;
    let shift = 0;
    if (r.right > window.innerWidth - pad) shift = window.innerWidth - pad - r.right;
    if (r.left + shift < pad) shift = pad - r.left;
    m.style.left = shift + 'px';
  }

  $$('[data-menu]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const m = $(btn.dataset.menu);
    const wasOpen = !m.hidden;
    closeMenus();
    if (!wasOpen) { m.hidden = false; placeMenu(m); }
  }));

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.menu-wrap')) closeMenus();
  });

  function setColor(c) {
    color = c;
    colorBtn.style.setProperty('--c', c);
    widthPrev.style.setProperty('--c', c);
    $$('.sw').forEach(b => b.classList.toggle('active', b.dataset.color === c));
  }
  function setWidth(w) {
    strokeWidth = w;
    widthRange.value = w;
    widthPrev.style.height = Math.max(2, w * 0.9) + 'px';
  }

  $$('.sw').forEach(btn => btn.addEventListener('click', () => {
    setColor(btn.dataset.color);
    saveUI();
    closeMenus();
    if (tool !== 'pen') setTool('pen');
  }));
  widthRange.addEventListener('input', e => { setWidth(+e.target.value); saveUI(); });

  $('clearBtn').addEventListener('click', () => {
    closeMenus();
    if (replayMode || !strokes.length) return;
    const items = strokes.slice();
    strokes = [];
    pushEvent({ type: 'clearStrokes' });
    commit({ t: 'clearStrokes', items });
    redraw();
  });

  $('clearTokens').addEventListener('click', () => {
    closeMenus();
    if (replayMode || !tokens.size) return;
    const items = [...tokens.values()].map(t => ({ ...t.d }));
    for (const t of tokens.values()) t.el.remove();
    tokens.clear();
    selected = null;
    pushEvent({ type: 'clearTokens' });
    commit({ t: 'clearTokens', items });
  });

  $$('[data-act="clearAll"]').forEach(b => b.addEventListener('click', () => {
    closeMenus();
    if (replayMode || (!strokes.length && !tokens.size)) return;
    const a = { t: 'clearAll', strokes: strokes.slice(), tokens: [...tokens.values()].map(x => ({ ...x.d })) };
    applyAction(a);
    commit(a);
    clearSelection();
    redraw();
  }));

  $('viewBtn').addEventListener('click', () => {
    closeMenus();
    viewHalf = !viewHalf;
    saveUI();
    layout();
  });
  $('flipBtn').addEventListener('click', () => {
    closeMenus();
    flipped = !flipped;
    saveUI();
    layout();
  });

  /* ================= фишки ================= */

  const clampX = x => Math.max(14, Math.min(W - 14, x));
  const clampY = y => Math.max(14, Math.min(H - 14, y));

  function nextNumber(kind) {
    const used = new Set();
    for (const t of tokens.values()) if (t.d.kind === kind) used.add(+t.d.label);
    let n = 1;
    while (used.has(n)) n++;
    return n;
  }

  function addToken(kind, record = true) {
    if (replayMode) return;
    let x, y, label = '';
    if (kind === 'puck') {
      x = 250 + (Math.random() - 0.5) * 50;
      y = 212 + (Math.random() - 0.5) * 50;
    } else {
      const n = nextNumber(kind);
      label = String(n);
      const base = kind === 'home' ? 170 : 330;
      x = base + (((n - 1) % 3) - 1) * 42;
      y = 212 + ((Math.floor((n - 1) / 3) % 3) - 1) * 88;
    }
    if (viewHalf && flipped) x = W - x;   // в повёрнутой половине — на видимую часть

    const d = { id: uid('tk'), kind, x: clampX(x), y: clampY(y), label };
    tokenAddP(d);
    if (record) commit({ t: 'addToken', d: { ...d } });
  }

  function doRemoveToken(id) {
    const t = tokens.get(id);
    if (!t) return;
    const d = { ...t.d };
    tokenDelP(id);
    commit({ t: 'removeToken', d });
  }

  $$('[data-add]').forEach(btn => btn.addEventListener('click', () => {
    addToken(btn.dataset.add);
    closeMenus();
    if (tool !== 'select') setTool('select');
  }));

  function onTokenDown(e) {
    if (tool !== 'select' || replayMode || e.button === 2) return;
    e.preventDefault();
    const el = e.currentTarget;
    const t = tokens.get(el.dataset.id);
    if (!t) return;
    const p = getPos(e);
    drag = { t, el, offX: t.d.x - p.x, offY: t.d.y - p.y, from: { x: t.d.x, y: t.d.y },
             moved: false, lastRec: 0, sx: e.clientX, sy: e.clientY };
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    el.addEventListener('pointermove', onTokenMove);
    el.addEventListener('pointerup', onTokenUp);
    el.addEventListener('pointercancel', onTokenUp);
  }

  function onTokenMove(e) {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
    const p = getPos(e);
    const x = clampX(p.x + drag.offX), y = clampY(p.y + drag.offY);
    drag.t.d.x = x; drag.t.d.y = y;
    positionToken(drag.el, x, y);
    drag.moved = true;
    const now = performance.now();
    if (now - drag.lastRec > 40) {
      drag.lastRec = now;
      pushEvent({ type: 'tokenMove', id: drag.t.d.id, x, y });
    }
  }

  function onTokenUp() {
    if (!drag) return;
    const { el, t } = drag;
    el.classList.remove('dragging');
    el.removeEventListener('pointermove', onTokenMove);
    el.removeEventListener('pointerup', onTokenUp);
    el.removeEventListener('pointercancel', onTokenUp);

    if (drag.moved) {
      pushEvent({ type: 'tokenMove', id: t.d.id, x: t.d.x, y: t.d.y });
      commit({ t: 'moveToken', id: t.d.id, from: drag.from, to: { x: t.d.x, y: t.d.y } });
    } else {
      const now = performance.now();
      if (el._lastTap && now - el._lastTap < 350) {
        el._lastTap = 0;
        doRemoveToken(t.d.id);          // двойной тап — удалить
      } else {
        el._lastTap = now;
        selectToken(el);
      }
    }
    drag = null;
  }

  function selectToken(el) {
    if (selected === el) { clearSelection(); return; }
    clearSelection();
    selected = el;
    el.classList.add('selected');
  }

  /* ================= воспроизведение ================= */

  function renderReplayFrame() {
    if (!player.rec) return;
    const st = stateAt(player.rec.events, player.time);
    clearCanvas();
    for (const s of st.strokes) drawStroke(s);
    syncReplayTokens(st.tokens);
    updateProgressUI();
  }

  function syncReplayTokens(list) {
    const seen = new Set();
    for (const t of list) {
      seen.add(t.id);
      let el = replayEls.get(t.id);
      if (!el) {
        el = createTokenEl(t.id, t.kind, t.label);
        replayEl.appendChild(el);
        replayEls.set(t.id, el);
      }
      el.dataset.x = t.x;
      el.dataset.y = t.y;
      positionToken(el, t.x, t.y);
    }
    for (const [id, el] of replayEls) if (!seen.has(id)) { el.remove(); replayEls.delete(id); }
  }

  const fmt = t => (t || 0).toFixed(1);

  function updateProgressUI() {
    if (!player.rec) return;
    const d = player.rec.duration;
    progressFill.style.width = Math.min(100, Math.max(0, d > 0 ? player.time / d * 100 : 0)) + '%';
    pbTime.textContent = fmt(player.time) + ' / ' + fmt(d) + ' с';
  }

  function updatePlaybackButtons() { pauseBtn.textContent = player.playing ? '⏸' : '▶'; }

  function enterReplay(r) {
    if (rec) stopRecording();
    if (replayMode) exitReplay();
    if (current) endStroke();
    closeSheet();
    closeMenus();
    clearSelection();

    player.rec = r;
    player.time = 0;
    player.playing = true;

    replayMode = true;
    document.body.classList.add('replay-mode');
    replayEl.innerHTML = '';
    replayEls.clear();

    playbackBar.hidden = false;
    pbName.textContent = r.name;

    updatePlaybackButtons();
    updatePointerEvents();
    renderReplayFrame();
  }

  function exitReplay() {
    if (!replayMode) return;
    replayMode = false;
    player.playing = false;
    player.rec = null;
    document.body.classList.remove('replay-mode');
    replayEl.innerHTML = '';
    replayEls.clear();
    playbackBar.hidden = true;
    updatePointerEvents();
    redraw();
  }

  pauseBtn.addEventListener('click', () => {
    if (!player.rec) return;
    if (player.playing) player.playing = false;
    else {
      if (player.time >= player.rec.duration) player.time = 0;
      player.playing = true;
    }
    updatePlaybackButtons();
    renderReplayFrame();
  });

  $('restartBtn').addEventListener('click', () => {
    if (!player.rec) return;
    player.time = 0;
    player.playing = true;
    updatePlaybackButtons();
    renderReplayFrame();
  });

  $('stopBtn').addEventListener('click', exitReplay);

  speedRange.addEventListener('input', () => {
    speed = SPEEDS[+speedRange.value];
    speedLabel.textContent = speed + 'x';
  });

  function seekFromEvent(e) {
    const r = progressWrap.getBoundingClientRect();
    player.time = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * player.rec.duration;
    renderReplayFrame();
  }
  let seeking = false;
  progressWrap.addEventListener('pointerdown', e => {
    if (!player.rec) return;
    seeking = true;
    progressWrap.setPointerCapture(e.pointerId);
    seekFromEvent(e);
  });
  progressWrap.addEventListener('pointermove', e => { if (seeking && player.rec) seekFromEvent(e); });
  progressWrap.addEventListener('pointerup', () => { seeking = false; });
  progressWrap.addEventListener('pointercancel', () => { seeking = false; });

  /* ================= библиотека ================= */

  function saveLib() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(lib)); } catch (e) {}
  }
  function loadLib() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) lib = JSON.parse(raw) || []; }
    catch (e) { lib = []; }
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts), p = n => String(n).padStart(2, '0');
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderLib() {
    libList.innerHTML = '';
    libEmpty.hidden = lib.length > 0;
    libBadge.textContent = lib.length;
    libBadge.hidden = lib.length === 0;

    for (const r of lib) {
      const li = document.createElement('li');
      li.className = 'lib-item';

      const info = document.createElement('div');
      info.className = 'lib-info';
      const nm = document.createElement('div');
      nm.className = 'lib-name';
      nm.textContent = r.name;
      const mt = document.createElement('div');
      mt.className = 'lib-meta';
      mt.textContent = fmt(r.duration) + ' с' + (r.created ? ' · ' + fmtDate(r.created) : '');
      info.append(nm, mt);

      const acts = document.createElement('div');
      acts.className = 'lib-actions';

      const bPlay = document.createElement('button');
      bPlay.className = 'play';
      bPlay.textContent = '▶';
      bPlay.title = 'Воспроизвести';
      bPlay.addEventListener('click', () => enterReplay(r));

      const bDel = document.createElement('button');
      bDel.textContent = '✕';
      bDel.title = 'Удалить';
      bDel.addEventListener('click', () => {
        if (!confirm('Удалить запись «' + r.name + '»?')) return;
        if (player.rec === r) exitReplay();
        lib = lib.filter(x => x !== r);
        saveLib();
        renderLib();
      });

      acts.append(bPlay, bDel);
      li.append(info, acts);
      libList.appendChild(li);
    }
  }

  function openSheet()  { closeMenus(); sheet.classList.add('open'); backdrop.classList.add('open'); }
  function closeSheet() { sheet.classList.remove('open'); backdrop.classList.remove('open'); }
  $('libBtn').addEventListener('click', openSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  /* ================= цикл ================= */

  let lastFrame = performance.now();
  function tick(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    if (replayMode && player.playing && player.rec) {
      player.time += dt * speed;
      if (player.time >= player.rec.duration) {
        player.time = player.rec.duration;
        player.playing = false;
        updatePlaybackButtons();
      }
      renderReplayFrame();
    }
    if (rec) updateRecLabel();
    requestAnimationFrame(tick);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSheet(); closeMenus(); }
    if (replayMode) {
      if (e.key === ' ') { pauseBtn.click(); e.preventDefault(); }
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected) {
      doRemoveToken(selected.dataset.id);
      e.preventDefault();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (e.shiftKey) redo(); else undo();
      e.preventDefault();
    }
  });

  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ================= старт ================= */

  loadUI();
  app.classList.toggle('collapsed', collapsed);
  applyLogo();

  setColor(color);
  setWidth(strokeWidth);
  setTool('select');
  loadLib();
  renderLib();
  updatePlaybackButtons();
  updateRecUI();
  updateHistoryUI();
  layout();

  new ResizeObserver(() => layout()).observe(stage);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  requestAnimationFrame(tick);

  ['home', 'home', 'away', 'away', 'puck'].forEach(k => addToken(k, false));
})();
</script>
</body>
</html>
